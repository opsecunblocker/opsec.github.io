<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-brand">
      <strong>{{ site.title }}</strong>
      <span>{{ site.tagline }}</span>
    </p>
    <nav class="footer-links" aria-label="Footer">
      <a href="{{ '/' | relative_url }}">All games</a>
      <a href="https://github.com/{{ site.repository }}" rel="noopener">Source</a>
      <a href="https://github.com/{{ site.repository }}/issues" rel="noopener">Report a bug</a>
      <a href="https://github.com/{{ site.repository }}/fork" rel="noopener">Add a game</a>
    </nav>
    <p class="footer-note">
      Every game here is written by hand in plain JavaScript and runs entirely in your
      browser — no trackers, no downloads, no network calls.
    </p>
  </div>
</footer>
