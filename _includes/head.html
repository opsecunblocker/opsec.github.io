<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: page.tagline | default: site.description | strip_newlines | strip }}">

<meta name="theme-color" content="#f7f0df">
<meta name="color-scheme" content="light">

<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/img/favicon.svg' | relative_url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: page.tagline | default: site.description | strip_newlines | strip }}">
<meta property="og:url" content="{{ page.url | default: '/' | absolute_url }}">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: page.tagline | default: site.description | strip_newlines | strip }}">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
