<!doctype html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {% include header.html %}

  <main id="main" class="site-main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {% if page.layout == 'game' %}
  <script src="{{ '/assets/js/game-core.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/games/' | append: page.slug | append: '.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
